[project]
name = "local-llm-playground"
version = "0.1.0"
description = "Local LLM inference and optimization experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.118.0",
    "httpx~=0.28.1",
    "nvidia-ml-py~=13.580.82",
    "pydantic~=2.12.0",
    "pydantic-settings~=2.11.0",
    "python-dotenv~=1.1.1",
    "rich~=14.1.0",
    "typer~=0.19.2",
    "uvicorn[standard]~=0.37.0",
]

[dependency-groups]
# Development and CPU-only validation dependencies. Inference engines intentionally
# live outside this environment to avoid conflicting CUDA/PyTorch dependency trees.
dev = [
    "basedpyright~=1.39.8",
    "pre-commit~=4.6.0",
    "pytest~=8.4.2",
    "pytest-asyncio~=1.2.0",
    "pytest-cov~=7.0.0",
    "ruff~=0.15.17",
]

[project.scripts]
local-llm = "src.services.local_llm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated tests",
    "integration: requires a running inference backend",
    "gpu: requires a CUDA-enabled GPU",
    "benchmark: performance experiments",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "PLR2004",
    "S101",
    "SLF001",
]
"scripts/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "INP001", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["deploy"]
reportMissingTypeStubs = true
reportUnknownArgumentType = true
reportUnknownMemberType = true
reportUnusedCallResult = true
reportDeprecated = false
reportUnusedVariable = "error"
reportUnusedImport = "error"
